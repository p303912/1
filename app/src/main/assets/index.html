<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>火烧云预测 新版</title>
    <meta name="theme-color" content="#0f0c29" />
    <link rel="stylesheet" href="hark.css" />
    <style>
      :root, :root[data-theme] {
        color-scheme: dark;
        --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", Roboto, "Segoe UI", sans-serif;
        --mono: ui-monospace, "Roboto Mono", monospace;
        --x-glass: rgba(255, 255, 255, 0.08);
        --x-line: rgba(255, 255, 255, 0.14);
        --x-dim: rgba(255, 255, 255, 0.66);
        --x-l0: #9a98b0; --x-l1: #ffc078; --x-l2: #ff9a3c; --x-l3: #ff5e3a; --x-l4: #e8304f; --x-l5: #e040c8;
        --x-bg: #0f0c29; --x-bg-grad: linear-gradient(170deg, #0f0c29 0%, #302b63 55%, #24243e 100%);
        --x-text: #fff; --x-text-2: rgba(255, 255, 255, 0.88); --x-soft: rgba(255, 255, 255, 0.12); --x-faint: rgba(255, 255, 255, 0.07);
        --x-track: rgba(255, 255, 255, 0.1); --x-shadow: none; --x-focus: rgba(255, 255, 255, 0.4);
        --x-chip-bg: #29245a; --x-chip-on: #fff; --x-chip-on-text: #1d1a45; --x-place-bg: #1d1a45;
        --x-hero-fade: linear-gradient(180deg, rgba(15,12,41,.35) 0%, rgba(15,12,41,0) 30%, rgba(15,12,41,.55) 68%, #0f0c29 100%);
        --x-hero-text: #fff; --x-hero-sub: rgba(255, 255, 255, 0.85); --x-hero-shadow: 0 2px 18px rgba(0, 0, 0, .35);
        --x-tile-on: rgba(255, 255, 255, 0.7); --x-lv0-text: #dcdbe8; --x-tag-filter: brightness(1.25);
      }
      html, body { background: var(--x-bg); color: var(--x-text); overflow-x: hidden; }
      body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--x-bg-grad); }
      .page.x-app { max-width: none; padding: 0 0 32px; gap: 0; }
      .x-wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; display: grid; gap: 28px; min-width: 0; }
      .x-card {
        background: var(--x-glass); border: 1px solid var(--x-line); border-radius: 20px; box-shadow: var(--x-shadow);
        -webkit-backdrop-filter: blur(20px) saturate(140%); backdrop-filter: blur(20px) saturate(140%);
      }
      @keyframes x-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      .x-fade { animation: x-in 0.6s var(--ease-out, ease-out) both; }
      .x-d1 { animation-delay: 0.08s; } .x-d2 { animation-delay: 0.16s; } .x-d3 { animation-delay: 0.24s; }

      /* hero */
      .x-hero { position: relative; height: 42vh; min-height: 260px; max-height: 460px; overflow: hidden; margin-bottom: -40px; }
      .x-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: x-zoom 1.4s ease-out both; }
      @keyframes x-zoom { from { transform: scale(1.06); opacity: 0; } to { transform: none; opacity: 1; } }
      .x-hero::after { content: ""; position: absolute; inset: 0; background: var(--x-hero-fade); }
      .x-hero__copy { position: absolute; z-index: 1; left: 0; right: 0; bottom: 52px; max-width: 640px; margin: 0 auto; padding: 0 16px; }
      .x-hero__place { display: inline-flex; align-items: center; gap: 6px; font: var(--type-label); color: var(--x-text); margin-bottom: 8px; padding: 4px 12px; border-radius: var(--r-pill); background: var(--x-place-bg); border: 1px solid var(--x-line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
      .x-hero h1 { font-size: 44px; line-height: 1.05; font-weight: 600; letter-spacing: 0.04em; color: var(--x-hero-text); text-shadow: var(--x-hero-shadow); }
      .x-hero__sub { font: var(--type-body); color: var(--x-hero-sub); margin-top: 6px; }

      /* sections */
      .x-sec { position: relative; display: grid; gap: 12px; min-width: 0; }
      .x-h { font: var(--type-heading); color: var(--x-text); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .x-h small { font: var(--type-small); color: var(--x-dim); }

      /* search + chips */
      .x-search { position: relative; }
      .x-search::before { content: "🔍"; position: absolute; left: 16px; top: 0; height: var(--tap); display: flex; align-items: center; font-size: 15px; pointer-events: none; opacity: .85; }
      .x-search input {
        width: 100%; box-sizing: border-box; height: var(--tap); padding: 0 18px 0 44px;
        border: 1px solid var(--x-line); border-radius: var(--r-pill); background: var(--x-glass); color: var(--x-text); font: var(--type-body); box-shadow: var(--x-shadow);
        -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); outline: none; -webkit-appearance: none; appearance: none;
      }
      .x-search input::placeholder { color: var(--x-dim); }
      .x-search input:focus { border-color: var(--x-focus); background: var(--x-soft); }
      .x-results { list-style: none; margin: 8px 0 0; padding: 0; overflow: hidden; }
      .x-results:empty { display: none; }
      .x-results button {
        display: block; width: 100%; min-height: var(--tap); padding: 10px 18px; text-align: left;
        background: transparent; color: var(--x-text); font: var(--type-body); border: 0; border-bottom: 1px solid var(--x-line); cursor: pointer;
      }
      .x-results li:last-child button { border-bottom: 0; }
      .x-results small { color: var(--x-dim); font: var(--type-small); margin-left: 6px; }
      .x-cities { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
      .x-cities::-webkit-scrollbar { display: none; }
      .x-chip {
        flex: 0 0 auto; height: var(--tap); min-width: var(--tap); padding: 0 16px; border-radius: var(--r-pill); cursor: pointer; scroll-snap-align: start;
        background: var(--x-chip-bg); border: 1px solid var(--x-line); color: var(--x-text); font: var(--type-label); white-space: nowrap;
        transition: background .2s, color .2s;
      }
      .x-chip[aria-pressed="true"] { background: var(--x-chip-on); color: var(--x-chip-on-text); border-color: var(--x-chip-on); }
      .x-place { font: var(--type-small); color: var(--x-dim); }

      /* next event */
      .x-next { padding: 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 20px; align-items: center; }
      .x-gauge { position: relative; width: 128px; height: 128px; }
      .x-gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .x-gauge circle { fill: none; stroke-width: 10; }
      .x-gauge .x-track { stroke: var(--x-track); }
      .x-gauge .x-arc { stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--ease-out, ease-out); filter: drop-shadow(0 0 6px var(--lc)); }
      .x-gauge__num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
      .x-gauge__num b { font-size: 40px; line-height: 1; font-weight: 600; color: var(--x-text); }
      .x-gauge__num span { font: var(--type-caption); color: var(--x-dim); margin-top: 4px; }
      .x-next__lv { font-size: 26px; line-height: 1.2; font-weight: 600; color: var(--lc); }
      .x-next__when { font: var(--type-label); color: var(--x-text); margin-top: 6px; }
      .x-next__count { font: var(--type-small); color: var(--x-dim); margin-top: 2px; }
      .x-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .x-badge { font: var(--type-tag); padding: 3px 10px; border-radius: var(--r-pill); background: var(--x-soft); color: var(--x-text); white-space: nowrap; }
      .x-next__reason { grid-column: 1 / -1; font: var(--type-body); color: var(--x-text-2); padding-top: 14px; border-top: 1px solid var(--x-line); }
      @media (max-width: 380px) { .x-gauge { width: 108px; height: 108px; } .x-gauge__num b { font-size: 34px; } .x-next { gap: 14px; padding: 16px; } .x-next__lv { font-size: 22px; } }

      /* level chips */
      .x-lv { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: var(--r-pill); font: var(--type-tag); white-space: nowrap; color: #fff; }
      .x-lv0 { background: rgba(154,152,176,.28); color: var(--x-lv0-text); }
      .x-lv1 { background: var(--x-l1); color: #3a2200; }
      .x-lv2 { background: var(--x-l2); color: #2a1300; }
      .x-lv3 { background: var(--x-l3); }
      .x-lv4 { background: var(--x-l4); }
      .x-lv5 { background: linear-gradient(90deg, var(--x-l4), var(--x-l5)); }

      /* 7-day */
      .x-days { display: grid; gap: 8px; }
      .x-day { display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: stretch; padding: 8px; }
      .x-day__date { font: var(--type-label); color: var(--x-text); align-self: center; padding-left: 4px; }
      .x-day__date small { display: block; font: var(--type-caption); color: var(--x-dim); }
      .x-tile {
        --lc: var(--x-l0);
        display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; min-height: var(--tap);
        padding: 10px 12px; border-radius: 14px; border: 1px solid transparent; cursor: pointer; text-align: left;
        background: linear-gradient(135deg, color-mix(in srgb, var(--lc) 34%, transparent), color-mix(in srgb, var(--lc) 10%, transparent));
        color: var(--x-text); font: var(--type-caption); transition: transform .15s, border-color .2s;
      }
      .x-tile:active { transform: scale(.97); }
      .x-tile__top { display: flex; justify-content: space-between; align-items: baseline; width: 100%; gap: 6px; font: var(--type-caption); color: var(--x-dim); }
      .x-tile__score { font-size: 22px; line-height: 1.1; font-weight: 600; color: var(--x-text); }
      .x-tile__score small { font: var(--type-tag); color: var(--lc); margin-left: 4px; filter: var(--x-tag-filter); }
      .x-tile.is-past { opacity: 0.45; }
      .x-tile[aria-pressed="true"] { border-color: var(--x-tile-on); }
      .x-tile:disabled { cursor: default; color: var(--x-dim); background: var(--x-faint); }

      /* detail */
      .x-detail { padding: 20px; margin-top: 12px; animation: x-in .45s ease-out both; }
      .x-detail h3 { margin: 0 0 8px; font: var(--type-heading); color: var(--x-text); }
      .x-detail .x-next__reason { border: 0; padding: 0 0 8px; }
      .x-bar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font: var(--type-small); color: var(--x-dim); margin: 10px 0; }
      .x-bar__track { height: 6px; border-radius: var(--r-pill); background: var(--x-track); overflow: hidden; }
      .x-bar__fill { height: 100%; background: linear-gradient(90deg, var(--x-l1), var(--x-l3), var(--x-l5)); border-radius: var(--r-pill); }
      .x-bar b { color: var(--x-text); text-align: right; font: var(--type-label); }
      .x-models { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 10px; }
      .x-detail .fineprint { color: var(--x-dim); }

      .x-skel { background: var(--x-faint); border-radius: 20px; min-height: 60px; animation: x-pulse 1.2s ease-in-out infinite; }
      .x-skel--big { min-height: 190px; }
      @keyframes x-pulse { 50% { opacity: 0.45; } }
      .x-foot { max-width: 640px; margin: 36px auto 0; padding: 20px 16px 0; border-top: 1px solid var(--x-line); display: grid; gap: 14px; font: var(--type-caption); color: var(--x-dim); }
      .x-foot .badge { justify-self: start; }
      @media (prefers-reduced-motion: reduce) { .x-skel, .x-fade, .x-hero img, .x-detail { animation: none; } .x-gauge .x-arc { transition: none; } }
    </style>
  </head>
  <body>
    <div class="page x-app" id="top">
      <header class="x-hero">
        <img src="sunset_hero.jpg" alt="城市天际线上空的火烧云" />
        <div class="x-hero__copy x-fade">
          <p class="x-hero__place" id="heroPlace">📍 上海</p>
          <h1>霞光</h1>
          <p class="x-hero__sub">火烧云预报 · 五模型集合</p>
        </div>
      </header>
      <main class="x-wrap">
        <section class="x-sec x-fade x-d1" id="place" aria-label="选一个地点">
          <div class="x-search">
            <input id="q" type="search" placeholder="搜索城市，如 厦门" aria-label="搜索城市" autocomplete="off" />
            <ul class="x-results x-card" id="results"></ul>
          </div>
          <div class="x-cities" id="cities"></div>
          <p class="x-place" id="placeLabel"></p>
        </section>

        <section class="x-sec x-fade x-d2" id="next">
          <h2 class="x-h">下一场烧不烧</h2>
          <div id="nextBox"></div>
        </section>

        <section class="x-sec x-fade x-d3" id="week">
          <h2 class="x-h">7 天日出日落 <small>点格子看详情</small></h2>
          <div id="weekBox"></div>
          <div id="detail"></div>
        </section>
      </main>
      <footer class="x-foot">
        <p>数据 Open-Meteo（ECMWF/GFS/ICON/CMA/JMA 集合计算）。</p>
        <a class="badge" href="https://hark.com/" target="_blank" rel="noopener"><span class="hark-mark"></span><span>built by hark</span></a>
      </footer>
    </div>
    <script src="hark.js"></script>
    <script>
      const MODELS = [["ecmwf_ifs025", "EC"], ["gfs_seamless", "GFS"], ["icon_seamless", "ICON"], ["cma_grapes_global", "CMA"], ["jma_seamless", "JMA"]];
      const CITIES = [["上海", 31.23, 121.47], ["北京", 39.9, 116.4], ["广州", 23.13, 113.26], ["深圳", 22.54, 114.06], ["杭州", 30.27, 120.15], ["成都", 30.57, 104.07], ["香港", 22.32, 114.17], ["新加坡", 1.29, 103.85]];
      const LV = [[15, "不烧"], [35, "微烧"], [55, "小烧"], [75, "中烧"], [90, "大烧"], [101, "超级大烧"]];
      const WK = "日一二三四五六";
      const $ = (id) => document.getElementById(id);
      let events = [], tz = "", token = 0, current = null, utcOff = 0, nextAt = null;

      const lvIdx = (s) => LV.findIndex((l) => s < l[0]);
      const chip = (s, pre) => { const k = lvIdx(s); return `<span class="x-lv x-lv${k}">${pre ? pre + " " : ""}${pre ? s : LV[k][1]}</span>`; };
      const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
      const median = (a) => { const b = [...a].sort((x, y) => x - y), n = b.length; return Math.round(n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2); };
      const fmtDate = (t) => { const d = new Date(t.slice(0, 10) + "T00:00Z"); return `${d.getUTCMonth() + 1}月${d.getUTCDate()}日`; };
      const wk = (t) => "周" + WK[new Date(t.slice(0, 10) + "T00:00Z").getUTCDay()];

      function renderCities() {
        $("cities").innerHTML = `<button class="x-chip" type="button" id="geo" aria-pressed="${!!current && !!current.geo}">📍 ${current && current.geo ? current.name : "我的位置"}</button>` +
          CITIES.map((c, i) => `<button class="x-chip" type="button" data-i="${i}" aria-pressed="${!!current && !current.geo && current.name === c[0]}">${c[0]}</button>`).join("");
      }
      $("cities").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        if (b.id === "geo") return locate();
        const c = CITIES[b.dataset.i]; load({ name: c[0], lat: c[1], lon: c[2] });
      });

      function locate() {
        $("placeLabel").textContent = "正在定位…";
        try {
          navigator.geolocation.getCurrentPosition(
            async (p) => {
              const lat = +p.coords.latitude.toFixed(2), lon = +p.coords.longitude.toFixed(2);
              let name = "我的位置";
              try {
                const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
                const g = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&localityLanguage=zh`, { signal: ctl.signal })).json();
                const city = g.city || g.principalSubdivision || "", loc = g.locality || "";
                const n = [city, loc && loc !== city ? loc : ""].filter(Boolean).join(" · ");
                if (n) name = n;
              } catch (e) {}
              load({ name, lat, lon, geo: true });
            },
            () => ($("placeLabel").textContent = "无法获取位置，请搜索或选择城市。"),
            { timeout: 10000 }
          );
        } catch (e) { $("placeLabel").textContent = "当前环境不支持定位，请搜索或选择城市。"; }
      }

      let deb;
      $("q").addEventListener("input", (e) => {
        clearTimeout(deb); const q = e.target.value.trim();
        if (!q) { $("results").innerHTML = ""; return; }
        deb = setTimeout(async () => {
          try {
            const r = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=zh`)).json();
            const list = r.results || [];
            $("results").innerHTML = list.length ? list.map((p, i) => `<li><button type="button" data-i="${i}">${p.name}<small>${[p.admin1, p.country].filter(Boolean).join(" · ")}</small></button></li>`).join("") : `<li><button type="button" disabled>没有找到“${q}”</button></li>`;
            $("results").onclick = (ev) => {
              const b = ev.target.closest("button[data-i]"); if (!b) return;
              const p = list[b.dataset.i]; $("results").innerHTML = ""; $("q").value = "";
              load({ name: p.name, lat: p.latitude, lon: p.longitude });
            };
          } catch (err) { $("results").innerHTML = `<li><button type="button" disabled>搜索失败，请稍后再试</button></li>`; }
        }, 300);
      });

      function skeleton() {
        $("nextBox").innerHTML = `<div class="x-skel x-skel--big"></div>`;
        $("weekBox").innerHTML = `<div class="x-days">${'<div class="x-skel"></div>'.repeat(7)}</div>`;
        $("detail").innerHTML = "";
      }

      const cache = {};
      async function getJson(u, tries) {
        if (cache[u]) return cache[u];
        for (let n = 0; ; n++) {
          const r = await fetch(u);
          if (r.ok) return (cache[u] = await r.json());
          if ((r.status !== 429 && r.status < 500) || n >= tries - 1) throw new Error(r.status);
          const ra = +r.headers.get("Retry-After");
          await new Promise((ok) => setTimeout(ok, ra > 0 && ra <= 10 ? ra * 1000 : 1500 * 2 ** n + Math.random() * 800));
        }
      }

      async function load(place) {
        current = place; renderCities();
        $("placeLabel").textContent = `${place.name} · ${place.lat.toFixed(2)}, ${place.lon.toFixed(2)}`;
        $("heroPlace").textContent = `📍 ${place.name}`;
        skeleton(); const my = ++token;
        const d = +(150 / (111.32 * Math.cos((place.lat * Math.PI) / 180))).toFixed(3);
        const lon = (x) => (((x + 540) % 360) - 180).toFixed(3);
        const fu = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat},${place.lat},${place.lat}&longitude=${lon(place.lon)},${lon(place.lon - d)},${lon(place.lon + d)}&hourly=cloud_cover_low,cloud_cover_mid,cloud_cover_high,precipitation_probability&daily=sunrise,sunset&timezone=auto&forecast_days=7&models=${MODELS.map((m) => m[0]).join(",")}`;
        const au = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${place.lat}&longitude=${place.lon}&hourly=aerosol_optical_depth&timezone=auto&forecast_days=5`;
        const key = `xsh:${place.lat.toFixed(2)},${place.lon.toFixed(2)}`;
        const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
        try {
          const [f, a] = await Promise.all([
            getJson(fu, 3).catch(() => getJson(fu.replace(/models=.*$/, "models=ecmwf_ifs025,gfs_seamless,icon_seamless"), 2)),
            fetch(au).then((r) => (r.ok ? r.json() : null)).catch(() => null),
          ]);
          if (my !== token) return;
          utcOff = (f[0] && f[0].utc_offset_seconds) || 0;
          compute(f, a); render();
          try { store && store.setItem(key, JSON.stringify({ at: Date.now(), f, a })); } catch (e) {}
        } catch (e) {
          if (my !== token) return;
          let saved = null;
          try { saved = store && JSON.parse(store.getItem(key) || "null"); } catch (err) {}
          if (saved && Date.now() - saved.at < 6 * 3600e3) {
            utcOff = (saved.f[0] && saved.f[0].utc_offset_seconds) || 0;
            compute(saved.f, saved.a); render();
            return;
          }
          $("nextBox").innerHTML = `<aside class="callout" aria-label="加载失败"><p class="callout__head">加载失败</p><p class="callout__lead"><strong>没能拿到预报数据。</strong> 数据源可能请求过于频繁或网络不通，稍等片刻再试。</p><button class="btn" type="button" id="retry">重试</button></aside>`;
          $("weekBox").innerHTML = "";
          $("retry").onclick = () => load(current);
        }
      }

      function compute(f, a) {
        const [L, W, E] = f, H = L.hourly, idx = {};
        H.time.forEach((t, i) => (idx[t] = i));
        const aod = {};
        if (a && a.hourly) a.hourly.time.forEach((t, i) => (aod[t] = a.hourly.aerosol_optical_depth[i]));
        tz = L.timezone_abbreviation || L.timezone || "";
        const off = L.utc_offset_seconds || 0;
        const nowLocal = new Date(Date.now() + off * 1000).toISOString().slice(0, 16);
        const dayVal = (type, j) => { for (const k of Object.keys(L.daily)) if (k.startsWith(type) && L.daily[k][j]) return L.daily[k][j]; return null; };
        events = [];
        for (let j = 0; j < 7; j++) for (const type of ["sunrise", "sunset"]) {
          const t = dayVal(type, j); if (!t) { events.push({ type, day: j, t: null }); continue; }
          const dt = new Date(t + ":00Z"); dt.setUTCMinutes(dt.getUTCMinutes() + 30, 0, 0); dt.setUTCMinutes(0);
          const i = idx[dt.toISOString().slice(0, 16)];
          const far = (type === "sunset" ? W : E).hourly, ao = aod[H.time[i]];
          const models = [], vals = { low: [], mid: [], high: [], far: [], rain: [] };
          if (i !== undefined) for (const [m, n] of MODELS) {
            const g = (h, v) => (h[v + "_" + m] || [])[i];
            const low = g(H, "cloud_cover_low"), mid = g(H, "cloud_cover_mid"), high = g(H, "cloud_cover_high");
            if (low == null || mid == null || high == null) continue;
            const fl = g(far, "cloud_cover_low"), fm = g(far, "cloud_cover_mid"), rain = g(H, "precipitation_probability") ?? 0;
            let s = 50; const mx = Math.max(mid, high);
            s += mx >= 25 && mx <= 75 ? 30 : (mx >= 10 && mx < 25) || (mx > 75 && mx <= 90) ? 10 : -15;
            s -= low > 60 ? 35 : low >= 30 ? 15 : 0;
            const fa = fl != null && fm != null ? (fl + fm) / 2 : null;
            if (fa != null) { s -= fa > 60 ? 30 : fa >= 40 ? 12 : 0; vals.far.push(fa); }
            if (ao != null) s += ao < 0.2 ? 10 : ao > 0.5 ? -20 : 0;
            if (rain > 60) s -= 20;
            models.push({ n, s: Math.max(0, Math.min(100, s)) });
            vals.low.push(low); vals.mid.push(mid); vals.high.push(high); vals.rain.push(rain);
          }
          if (!models.length) { events.push({ type, day: j, t, past: t < nowLocal }); continue; }
          const hrs = (Date.parse(t + ":00Z") - Date.parse(nowLocal + ":00Z")) / 3.6e6;
          const near = hrs >= -1 && hrs <= 12;
          const sc = models.flatMap((x) => (near && (x.n === "EC" || x.n === "ICON") ? [x.s, x.s] : [x.s]));
          const v = { low: avg(vals.low), mid: avg(vals.mid), high: avg(vals.high), far: avg(vals.far), rain: avg(vals.rain), aod: ao };
          events.push({ type, day: j, t, past: t < nowLocal, score: median(sc), models, v, reason: reason(v, type) });
        }
      }

      function reason(v, type) {
        const p = [], mx = Math.max(v.mid, v.high), side = type === "sunset" ? "西" : "东";
        p.push(mx >= 25 && mx <= 75 ? `中高云适中（${Math.round(mx)}%）` : mx < 25 ? "中高云偏少，缺少“画布”" : "中高云过厚");
        if (v.low > 60) p.push("本地低云厚，遮挡明显"); else if (v.low >= 30) p.push("本地有低云");
        if (v.far != null) p.push(v.far > 60 ? `${side}侧光路被挡` : v.far >= 40 ? `${side}侧光路部分受阻` : `${side}侧光路通畅`);
        if (v.rain > 60) p.push("降水概率高");
        if (v.aod != null) p.push(v.aod < 0.2 ? "空气通透" : v.aod > 0.5 ? "气溶胶偏重" : "空气一般");
        return p.join("，") + "。";
      }

      const typeName = (t) => (t === "sunrise" ? "日出" : "日落");
      const dayName = (e) => (e.day === 0 ? "今天" : e.day === 1 ? "明天" : wk(e.t));

      function render() {
        const nx = events.find((e) => e.t && !e.past && e.score != null);
        const R = 52, C = 2 * Math.PI * R;
        if (nx) {
          const lc = `var(--x-l${lvIdx(nx.score)})`;
          $("nextBox").innerHTML = `<div class="x-next x-card x-fade" style="--lc:${lc}">
             <div class="x-gauge" role="img" aria-label="评分 ${nx.score} 分，${LV[lvIdx(nx.score)][1]}">
               <svg viewBox="0 0 128 128"><circle class="x-track" cx="64" cy="64" r="${R}"/><circle class="x-arc" id="arc" cx="64" cy="64" r="${R}" stroke="${lc}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
               <div class="x-gauge__num"><b>${nx.score}</b><span>/ 100</span></div>
             </div>
             <div>
               <p class="x-next__lv">${LV[lvIdx(nx.score)][1]}</p>
               <p class="x-next__when">${dayName(nx)}${typeName(nx.type)} · ${fmtDate(nx.t)} ${nx.t.slice(11, 16)}</p>
               <p class="x-next__count" id="countdown"></p>
             </div>
             <p class="x-next__reason">${nx.reason}</p></div>`;
          requestAnimationFrame(() => requestAnimationFrame(() => { const a = $("arc"); if (a) a.style.strokeDashoffset = C * (1 - nx.score / 100); }));
          nextAt = Date.parse(nx.t + ":00Z") - utcOff * 1000;
          tick();
        } else {
          nextAt = null;
          $("nextBox").innerHTML = `<p class="x-place">暂无可用的预报。</p>`;
        }
        let html = '<div class="x-days">';
        for (let j = 0; j < 7; j++) {
          const pair = events.filter((e) => e.day === j), ref = pair.find((e) => e.t);
          if (!ref) continue;
          html += `<div class="x-day x-card x-fade" style="animation-delay:${j * 0.05}s"><div class="x-day__date">${fmtDate(ref.t)}<small>${dayName(ref)}</small></div>` +
            pair.map((e) => {
              const k = events.indexOf(e);
              if (e.score == null) return `<button class="x-tile" type="button" disabled><span class="x-tile__top"><span>${typeName(e.type)}</span><span>${e.t ? e.t.slice(11, 16) : "—"}</span></span>无数据</button>`;
              return `<button class="x-tile${e.past ? " is-past" : ""}" type="button" data-k="${k}" aria-pressed="false" style="--lc:var(--x-l${lvIdx(e.score)})"><span class="x-tile__top"><span>${typeName(e.type)} ${e.t.slice(11, 16)}</span></span><span class="x-tile__score">${e.score}<small>${LV[lvIdx(e.score)][1]}</small></span></button>`;
            }).join("") + "</div>";
        }
        $("weekBox").innerHTML = html + "</div>";
        if (nx) detail(events.indexOf(nx), false);
      }

      $("weekBox").addEventListener("click", (e) => {
        const b = e.target.closest(".x-tile[data-k]"); if (b) detail(+b.dataset.k, true);
      });

      function detail(k, scroll) {
        const e = events[k], v = e.v;
        document.querySelectorAll(".x-tile[data-k]").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.k === k));
        const bar = (label, val, max = 100, txt) => val == null ? "" :
          `<div class="x-bar"><span>${label}</span><div class="x-bar__track"><div class="x-bar__fill" style="width:${Math.min(100, (val / max) * 100)}%"></div></div><b>${txt || Math.round(val) + "%"}</b></div>`;
        const side = e.type === "sunset" ? "西侧 150km" : "东侧 150km";
        $("detail").innerHTML = `<div class="x-detail x-card"><h3>${fmtDate(e.t)} ${typeName(e.type)} ${e.t.slice(11, 16)} · ${LV[lvIdx(e.score)][1]} ${e.score}</h3>
          <p class="x-next__reason">${e.reason}</p>
          ${bar("本地低云", v.low)}${bar("本地中云", v.mid)}${bar("本地高云", v.high)}${bar(side + "低+中云", v.far)}${bar("降水概率", v.rain)}${bar("气溶胶 AOD", v.aod, 1, v.aod != null ? v.aod.toFixed(2) : "")}
          <p class="fineprint">时间为当地 ${tz}。</p></div>`;
        if (scroll) $("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function tick() {
        const el = $("countdown"); if (!el || nextAt == null) return;
        const m = Math.round((nextAt - Date.now()) / 60000);
        if (m <= 0) { el.textContent = "正在发生"; return; }
        const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
        el.textContent = "还有 " + (d ? d + " 天 " : "") + (d || h ? h + " 小时 " : "") + mm + " 分钟";
      }
      setInterval(tick, 30000);

      load({ name: "上海", lat: 31.23, lon: 121.47 });
    </script>
  </body>
</html>
