name: xiaguang-apk
on:
  push:
    branches: [xiaguang-app]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon
      - name: commit apk
        run: |
          mkdir -p apk && cp app/build/outputs/apk/debug/app-debug.apk apk/XiaguangForecast.apk
          git config user.name "xiaguang-bot"; git config user.email "bot@users.noreply.github.com"
          git add apk/XiaguangForecast.apk && git commit -m "apk build [skip ci]" && git push
